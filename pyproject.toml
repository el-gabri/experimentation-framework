[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-experiments"
version = "2.0.0a1"
description = "Python design and audit workflow for small-market geo experiments"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gabriel Lisboa" },
]
requires-python = ">=3.10"
keywords = [
    "causal-inference",
    "experimentation",
    "geo-experiments",
    "synthetic-control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
]

[project.optional-dependencies]
spark = ["pyspark>=3.4"]
test = ["pytest>=8.0"]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "nbformat>=5.9",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/el-gabri/experimentation-framework"
Documentation = "https://github.com/el-gabri/experimentation-framework#readme"
Repository = "https://github.com/el-gabri/experimentation-framework.git"
Issues = "https://github.com/el-gabri/experimentation-framework/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["supply_experiments*"]
namespaces = false

[tool.setuptools.package-data]
supply_experiments = ["py.typed"]

[tool.pytest.ini_options]
# `tests/test_calibration_certificate.py` importa `calibration_certificate`, um
# script na raiz do repositório e fora do pacote instalável (src-layout). Só
# `python -m pytest` insere o CWD em sys.path; a CI invoca `pytest` direto, que
# não insere. Declarar o rootdir aqui faz as duas formas resolverem o import.
pythonpath = ["."]
markers = [
    "slow: statistical calibration tests (effect recovery, A/A FPR) — slower, run in CI",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# UP (pyupgrade) intencionalmente fora: modernizar List/Dict/Optional em todo o
# código legado é cosmético e de baixo valor aqui; E/F/I/B cobrem bugs reais
# (imports não usados, variáveis mortas, comparações erradas) e estilo de import.
ignore = ["E501"]  # linhas longas em fórmulas matemáticas são mais legíveis inteiras

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports intencionais (superfície pública do pacote)

[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
no_site_packages = true
ignore_missing_imports = true
warn_unused_ignores = true
