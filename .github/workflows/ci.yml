name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests calibration_certificate.py
      - run: mypy src
      - name: Notebooks são derivados de make_notebooks.py
        run: |
          python make_notebooks.py
          git diff --exit-code -- notebooks

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Fast tests
        run: pytest tests/ -q -m "not slow"

  statistical-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Slow statistical regression tests (effect recovery, A/A FPR)
        run: pytest tests/ -q -m slow
      - name: Reproduce the A/A calibration certificate
        id: reproduce_certificate
        run: python calibration_certificate.py --output-dir calibration-artifacts
      - name: Upload the public calibration certificate
        if: ${{ always() && steps.reproduce_certificate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: statistical-calibration-certificate
          path: calibration-artifacts/calibration_certificate.json
          if-no-files-found: error
          retention-days: 90
